[theme]
base = "light"
# Kasavu ivory background, forest green primary, teak text.
primaryColor = "#1E4D36"
backgroundColor = "#FBF7EC"
secondaryBackgroundColor = "#F2E9D3"
textColor = "#2E2015"
linkColor = "#1E4D36"
borderColor = "#E3D6B6"
baseRadius = "0.75rem"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap"

[client]
toolbarMode = "minimal"

[server]
runOnSave = false
